<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>

  <rect width="960" height="380" rx="16" fill="url(#bgGrad3)"/>

  <text x="480" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#f8fafc" text-anchor="middle">
    OPERATIONAL CRITERION: HOW TO TEST IF A REFERENCE FRAME IS INERTIAL
  </text>
  <text x="480" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#a5b4fc" text-anchor="middle">
    Newton's 1st Law is the fundamental experimental diagnostic separating real physics from fictitious kinematics
  </text>

  <!-- Step 1 Box -->
  <g transform="translate(40, 85)">
    <rect width="260" height="250" rx="10" fill="#1e293b" stroke="#6366f1" stroke-width="1.5"/>
    <circle cx="30" cy="30" r="14" fill="#4f46e5"/>
    <text x="30" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="55" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#818cf8">Isolate the Test Body</text>

    <text x="20" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">Take an object and eliminate all known physical interactions:</text>
    <text x="20" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">• Zero friction (dry-ice puck)</text>
    <text x="20" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">• Zero tension / normal push</text>
    <text x="20" y="138" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">• Zero electromagnetic fields</text>
    
    <rect x="20" y="170" width="220" height="50" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="130" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle">F_real,net = 0</text>
  </g>

  <!-- Step 2 Box -->
  <g transform="translate(350, 85)">
    <rect width="260" height="250" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="30" cy="30" r="14" fill="#059669"/>
    <text x="30" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="55" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#34d399">Observe Kinematics</text>

    <text x="20" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">Track displacement over time using synchronized clocks:</text>
    
    <rect x="20" y="105" width="220" height="50" rx="6" fill="#064e3b" fill-opacity="0.5" stroke="#059669" stroke-width="1"/>
    <text x="130" y="128" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#6ee7b7" text-anchor="middle">Case A: a = 0 (v = const)</text>
    <text x="130" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#a7f3d0" text-anchor="middle">Frame is INERTIAL ✓</text>

    <rect x="20" y="170" width="220" height="50" rx="6" fill="#7f1d1d" fill-opacity="0.5" stroke="#dc2626" stroke-width="1"/>
    <text x="130" y="193" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#fca5a5" text-anchor="middle">Case B: a ≠ 0 (accelerates)</text>
    <text x="130" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#fecaca" text-anchor="middle">Frame is NON-INERTIAL ✗</text>
  </g>

  <!-- Step 3 Box -->
  <g transform="translate(660, 85)">
    <rect width="260" height="250" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="30" cy="30" r="14" fill="#d97706"/>
    <text x="30" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="55" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#fbbf24">Apply Mechanics</text>

    <text x="20" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">Equations of motion you are permitted to write:</text>

    <rect x="20" y="105" width="220" height="50" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="130" y="127" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Inertial Frame Form:</text>
    <text x="130" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#4ade80" text-anchor="middle">Σ F_real = m a</text>

    <rect x="20" y="170" width="220" height="50" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="130" y="192" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Non-Inertial Frame Form:</text>
    <text x="130" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#f87171" text-anchor="middle">Σ F_real + F_fict = m a'</text>
  </g>
</svg>
