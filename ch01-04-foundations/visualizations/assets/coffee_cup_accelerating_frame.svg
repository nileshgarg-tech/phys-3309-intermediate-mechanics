<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#ef4444"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#22c55e"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#c084fc"/>
    </marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" rx="16" fill="url(#bgGrad)"/>

  <!-- Title Banner -->
  <text x="480" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle" letter-spacing="0.5">
    THE COFFEE CUP PARADOX: INERTIAL VS. NON-INERTIAL OBSERVER
  </text>
  <text x="480" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">
    Why Newton's First Law is an operational test for reference frames, not a trivial case of F = ma
  </text>

  <!-- Left Card: Ground Observer (Inertial Frame S) -->
  <g transform="translate(30, 85)">
    <rect width="435" height="365" rx="12" fill="url(#cardGrad1)" stroke="#38bdf8" stroke-width="1.5" filter="url(#glow)"/>
    
    <!-- Badge -->
    <rect x="20" y="18" width="180" height="26" rx="6" fill="#0369a1" fill-opacity="0.4"/>
    <text x="30" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">
      FRAME S: GROUND (INERTIAL)
    </text>

    <!-- Subtitle -->
    <text x="20" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">
      Observer stands on track. Train accelerates right: <tspan fill="#38bdf8" font-weight="700">a_train = +a x̂</tspan>
    </text>

    <!-- Train Car illustration -->
    <g transform="translate(30, 80)">
      <!-- Car body -->
      <rect x="0" y="30" width="375" height="110" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2" stroke-dasharray="4 2"/>
      <!-- Table -->
      <rect x="130" y="90" width="140" height="10" rx="2" fill="#64748b"/>
      <rect x="145" y="100" width="8" height="40" fill="#475569"/>
      <rect x="247" y="100" width="8" height="40" fill="#475569"/>
      <!-- Wheels -->
      <circle cx="60" cy="150" r="14" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
      <circle cx="315" cy="150" r="14" fill="#334155" stroke="#94a3b8" stroke-width="2"/>

      <!-- Cup -->
      <path d="M 185 72 L 188 90 L 212 90 L 215 72 Z" fill="url(#cupGrad)" stroke="#f59e0b" stroke-width="1.5"/>
      <!-- Cup handle -->
      <path d="M 215 76 Q 223 81 213 86" fill="none" stroke="#f59e0b" stroke-width="2"/>

      <!-- Motion Arrows -->
      <!-- Train acceleration -->
      <line x1="280" y1="15" x2="355" y2="15" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
      <text x="315" y="8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">a_car = +a</text>

      <!-- Table movement cue -->
      <line x1="140" y1="84" x2="175" y2="84" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 2" marker-end="url(#arrowBlue)"/>

      <!-- Ground Observer figure -->
      <circle cx="20" cy="120" r="7" fill="#94a3b8"/>
      <line x1="20" y1="127" x2="20" y2="150" stroke="#94a3b8" stroke-width="2"/>
      <line x1="10" y1="135" x2="30" y2="135" stroke="#94a3b8" stroke-width="2"/>
      <line x1="20" y1="150" x2="12" y2="170" stroke="#94a3b8" stroke-width="2"/>
      <line x1="20" y1="150" x2="28" y2="170" stroke="#94a3b8" stroke-width="2"/>
      <text x="20" y="185" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Ground</text>
    </g>

    <!-- FBD Box -->
    <rect x="20" y="275" width="395" height="75" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="35" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#22c55e">
      PHYSICAL DYNAMICS IN FRAME S:
    </text>
    <text x="35" y="315" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#cbd5e1">
      • Net horizontal force on cup: <tspan fill="#22c55e" font-weight="700">F_net,x = 0</tspan> (frictionless table)
    </text>
    <text x="35" y="333" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#cbd5e1">
      • By Newton 1: <tspan fill="#38bdf8" font-weight="700">a_cup = 0</tspan>. Cup stays at rest; car accelerates out beneath it!
    </text>
  </g>

  <!-- Right Card: Train Observer (Non-Inertial Frame S') -->
  <g transform="translate(495, 85)">
    <rect width="435" height="365" rx="12" fill="url(#cardGrad1)" stroke="#ef4444" stroke-width="1.5" filter="url(#glow)"/>
    
    <!-- Badge -->
    <rect x="20" y="18" width="220" height="26" rx="6" fill="#991b1b" fill-opacity="0.4"/>
    <text x="30" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#f87171">
      FRAME S': ACCELERATING TRAIN
    </text>

    <!-- Subtitle -->
    <text x="20" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">
      Observer rides inside. Train frame accelerated by <tspan fill="#f87171" font-weight="700">+a x̂</tspan>
    </text>

    <!-- Train Car illustration -->
    <g transform="translate(30, 80)">
      <!-- Car body (solid to show internal frame) -->
      <rect x="0" y="30" width="375" height="110" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
      <!-- Table -->
      <rect x="130" y="90" width="140" height="10" rx="2" fill="#64748b"/>
      <rect x="145" y="100" width="8" height="40" fill="#475569"/>
      <rect x="247" y="100" width="8" height="40" fill="#475569"/>
      <!-- Wheels -->
      <circle cx="60" cy="150" r="14" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
      <circle cx="315" cy="150" r="14" fill="#334155" stroke="#94a3b8" stroke-width="2"/>

      <!-- Cup sliding left -->
      <path d="M 165 72 L 168 90 L 192 90 L 195 72 Z" fill="url(#cupGrad)" stroke="#f59e0b" stroke-width="1.5"/>
      <path d="M 195 76 Q 203 81 193 86" fill="none" stroke="#f59e0b" stroke-width="2"/>

      <!-- Apparent Acceleration Arrow on Cup -->
      <line x1="165" y1="80" x2="115" y2="80" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrowRed)"/>
      <text x="140" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#ef4444" text-anchor="middle">a' = -a</text>

      <!-- Fictitious Force Vector -->
      <line x1="165" y1="105" x2="105" y2="105" stroke="#c084fc" stroke-width="2" marker-end="url(#arrowPurple)"/>
      <text x="135" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#c084fc" text-anchor="middle">F_inertial = -ma</text>

      <!-- Train Observer figure inside car -->
      <circle cx="320" cy="80" r="7" fill="#f87171"/>
      <line x1="320" y1="87" x2="320" y2="110" stroke="#f87171" stroke-width="2"/>
      <line x1="310" y1="95" x2="330" y2="95" stroke="#f87171" stroke-width="2"/>
      <line x1="320" y1="110" x2="312" y2="130" stroke="#f87171" stroke-width="2"/>
      <line x1="320" y1="110" x2="328" y2="130" stroke="#f87171" stroke-width="2"/>
      <text x="320" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#f87171" text-anchor="middle">Observer S'</text>
    </g>

    <!-- FBD Box -->
    <rect x="20" y="275" width="395" height="75" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="35" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#f87171">
      NON-INERTIAL BREAKDOWN IN FRAME S':
    </text>
    <text x="35" y="315" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#cbd5e1">
      • Real force: <tspan fill="#f87171" font-weight="700">F_real = 0</tspan>, yet the cup accelerates backward!
    </text>
    <text x="35" y="333" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#cbd5e1">
      • Newton 1 <tspan fill="#ef4444" font-weight="700">FAILS</tspan> unless fictitious force <tspan fill="#c084fc" font-weight="700">F_fict = -m a_frame</tspan> is added.
    </text>
  </g>
</svg>
